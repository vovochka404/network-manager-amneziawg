name: CI Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-style:
    # Pinned: another clang-format major version formats differently
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      # Every .c/.h below src/, shared/, properties/ and tests/, the same set
      # as locally; shared/nm-utils is excluded by .clang-format-ignore.
      - name: Check code style
        run: ./scripts/check-style.sh

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc pkg-config intltool \
            libnm-dev libnma-dev libgtk-3-dev \
            libnma-gtk4-dev libgtk-4-dev libgtk-4-bin \
            gettext libglib2.0-dev dpkg-dev

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DWITH_GTK3=ON \
            -DWITH_GTK4=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Build DEB package
        run: |
          cd build
          cpack -G DEB
          dpkg-deb --field ./*.deb Depends

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkmanager-amneziawg-deb
          path: build/*.deb
          if-no-files-found: ignore

  build-fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # git before actions/checkout, see release.yml.
      - name: Install dependencies
        run: |
          dnf install -y git cmake gcc pkg-config intltool \
            NetworkManager-libnm-devel \
            libnma-devel gtk3-devel \
            libnma-gtk4-devel gtk4-devel \
            glib2-devel gettext rpm-build

      - uses: actions/checkout@v4

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib64 \
            -DWITH_GTK3=ON \
            -DWITH_GTK4=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Build RPM package
        run: |
          cd build
          cpack -G RPM

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkmanager-amneziawg-rpm
          path: build/*.rpm
          if-no-files-found: ignore
